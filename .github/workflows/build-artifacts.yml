name: Build All Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: "main"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── CLI binaries (all platforms) ────────────────────────────────────────────
  cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI release binary
        run: cargo build --release --target ${{ matrix.target }} --package zvault-cli

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGING="zvault-cli-${{ matrix.target }}"
          mkdir -p "$STAGING"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/zvault-cli.exe" "$STAGING/zvault.exe"
          else
            cp "target/${{ matrix.target }}/release/zvault-cli" "$STAGING/zvault"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGING/"
          tar czf "$STAGING.tar.gz" "$STAGING"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          STAGING="zvault-cli-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/zvault-cli.exe" "$STAGING/zvault.exe"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGING/"
          7z a "$STAGING.zip" "$STAGING"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: zvault-cli-${{ matrix.target }}.*
          retention-days: 30

  # ── WASM package ────────────────────────────────────────────────────────────
  wasm:
    name: WASM package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM
        run: cd crates/zvault-wasm && wasm-pack build --target web --release

      - name: Upload WASM pkg
        uses: actions/upload-artifact@v7
        with:
          name: zvault-wasm-pkg
          path: crates/zvault-wasm/pkg/
          retention-days: 30

  # ── Browser extension ───────────────────────────────────────────────────────
  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download WASM pkg
        uses: actions/download-artifact@v7
        with:
          name: zvault-wasm-pkg
          path: crates/zvault-wasm/pkg/

      - name: Install & build extension
        run: cd apps/extension && npm ci && npx wxt build

      - name: Package extension
        run: cd apps/extension/.output && zip -r ../../../zvault-extension-chrome-mv3.zip chrome-mv3/

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: zvault-extension-chrome-mv3
          path: zvault-extension-chrome-mv3.zip
          retention-days: 30

  # ── Desktop app (Tauri) ─────────────────────────────────────────────────────
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: cd apps/desktop && npm ci

      - name: Build frontend
        run: cd apps/desktop && npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri app
        run: cd apps/desktop/src-tauri && cargo tauri build --target ${{ matrix.target }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 30

  # ── Android native libraries ────────────────────────────────────────────────
  android:
    name: Android libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build all Android targets
        run: |
          cargo build -p zvault-uniffi --target aarch64-linux-android --release
          cargo build -p zvault-uniffi --target armv7-linux-androideabi --release
          cargo build -p zvault-uniffi --target x86_64-linux-android --release
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang

      - name: Package Android JNI libs
        run: |
          mkdir -p jniLibs/arm64-v8a jniLibs/armeabi-v7a jniLibs/x86_64
          cp target/aarch64-linux-android/release/libzvault_uniffi.so jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libzvault_uniffi.so jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libzvault_uniffi.so jniLibs/x86_64/
          zip -r zvault-android-jnilibs.zip jniLibs/

      - name: Upload Android libraries
        uses: actions/upload-artifact@v7
        with:
          name: zvault-android-jnilibs
          path: zvault-android-jnilibs.zip
          retention-days: 30
