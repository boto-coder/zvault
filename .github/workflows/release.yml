name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── CLI binaries ────────────────────────────────────────────────────────────
  cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI release binary
        run: cargo build --release --target ${{ matrix.target }} --package zvault-cli

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGING="zvault-cli-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/zvault-cli" "$STAGING/zvault"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGING/"
          tar czf "$STAGING.tar.gz" "$STAGING"
          echo "ASSET=$STAGING.tar.gz" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          STAGING="zvault-cli-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/zvault-cli.exe" "$STAGING/zvault.exe"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGING/"
          7z a "$STAGING.zip" "$STAGING"
          echo "ASSET=$STAGING.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-cli-${{ matrix.target }}
          path: ${{ env.ASSET }}
          retention-days: 1

  # ── WASM package ────────────────────────────────────────────────────────────
  wasm:
    name: WASM package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM
        run: cd crates/zvault-wasm && wasm-pack build --target web --release

      - name: Package WASM
        run: |
          cd crates/zvault-wasm
          tar czf "../../zvault-wasm-${GITHUB_REF_NAME}.tar.gz" pkg/
          echo "ASSET=zvault-wasm-${GITHUB_REF_NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-wasm
          path: ${{ env.ASSET }}
          retention-days: 1

  # ── Browser extension ───────────────────────────────────────────────────────
  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download WASM pkg
        uses: actions/download-artifact@v7
        with:
          name: release-wasm
          path: .

      - name: Extract WASM
        run: tar xzf zvault-wasm-*.tar.gz -C crates/zvault-wasm/

      - name: Build extension
        run: cd apps/extension && npm ci && npx wxt build

      - name: Package extension
        run: |
          cd apps/extension/.output
          zip -r "../../../zvault-extension-chrome-mv3-${GITHUB_REF_NAME}.zip" chrome-mv3/
          echo "ASSET=zvault-extension-chrome-mv3-${GITHUB_REF_NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-extension
          path: ${{ env.ASSET }}
          retention-days: 1

  # ── Desktop app (Tauri) ─────────────────────────────────────────────────────
  desktop:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & build frontend
        run: cd apps/desktop && npm ci && npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri app
        run: cd apps/desktop/src-tauri && cargo tauri build --target ${{ matrix.target }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 1

  # ── Android native libraries ────────────────────────────────────────────────
  android:
    name: Android libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build all Android targets
        run: |
          cargo build -p zvault-uniffi --target aarch64-linux-android --release
          cargo build -p zvault-uniffi --target armv7-linux-androideabi --release
          cargo build -p zvault-uniffi --target x86_64-linux-android --release
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang

      - name: Package Android JNI libs
        run: |
          mkdir -p jniLibs/arm64-v8a jniLibs/armeabi-v7a jniLibs/x86_64
          cp target/aarch64-linux-android/release/libzvault_uniffi.so jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libzvault_uniffi.so jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libzvault_uniffi.so jniLibs/x86_64/
          zip -r "zvault-android-jnilibs-${GITHUB_REF_NAME}.zip" jniLibs/
          echo "ASSET=zvault-android-jnilibs-${GITHUB_REF_NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: ${{ env.ASSET }}
          retention-days: 1

  # ── Create GitHub Release ───────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [cli, wasm, extension, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: artefacts/
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd artefacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artefacts/**/*.tar.gz
            artefacts/**/*.zip
            artefacts/**/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
