name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust Test (matrix: Linux, Windows, macOS) ───────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

  # ── WASM build ──────────────────────────────────────────────────────────────
  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ubuntu-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build WASM (cargo)
        run: cargo build -p zvault-wasm --target wasm32-unknown-unknown

      - name: Build WASM (wasm-pack)
        run: cd crates/zvault-wasm && wasm-pack build --target web

      - name: Upload WASM pkg
        uses: actions/upload-artifact@v7
        with:
          name: zvault-wasm-pkg
          path: crates/zvault-wasm/pkg/
          retention-days: 7

  # ── Browser extension build ─────────────────────────────────────────────────
  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download WASM pkg
        uses: actions/download-artifact@v7
        with:
          name: zvault-wasm-pkg
          path: crates/zvault-wasm/pkg/

      - name: Install extension dependencies
        run: cd apps/extension && npm ci

      - name: Build extension (Chrome MV3)
        run: cd apps/extension && npx wxt build

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: zvault-extension-chrome
          path: apps/extension/.output/chrome-mv3/
          retention-days: 7

  # ── Desktop app (Tauri) build ───────────────────────────────────────────────
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: cd apps/desktop && npm ci

      - name: Build frontend
        run: cd apps/desktop && npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri app
        run: cd apps/desktop/src-tauri && cargo tauri build --target ${{ matrix.target }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: zvault-desktop-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 7

  # ── Android (UniFFI library build) ──────────────────────────────────────────
  android:
    name: Android library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ubuntu-android-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build UniFFI library (aarch64)
        run: cargo build -p zvault-uniffi --target aarch64-linux-android --release
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang

      - name: Build UniFFI library (armv7)
        run: cargo build -p zvault-uniffi --target armv7-linux-androideabi --release
        env:
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang

      - name: Build UniFFI library (x86_64)
        run: cargo build -p zvault-uniffi --target x86_64-linux-android --release
        env:
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang

      - name: Upload Android libraries
        uses: actions/upload-artifact@v7
        with:
          name: zvault-android-libs
          path: |
            target/aarch64-linux-android/release/libzvault_uniffi.so
            target/armv7-linux-androideabi/release/libzvault_uniffi.so
            target/x86_64-linux-android/release/libzvault_uniffi.so
          retention-days: 7

  # ── Security audit ──────────────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  # ── Code coverage ───────────────────────────────────────────────────────────
  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate LCOV report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: lcov-report
          path: lcov.info
          retention-days: 7
