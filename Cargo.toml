[workspace]
resolver = "2"
members = [
    "crates/zvault-core",
    "crates/zvault-cli",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["ZVault Contributors"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/boto-coder/zvault"
rust-version = "1.75"

[workspace.dependencies]
# Serialisation
serde        = { version = "1.0.219", features = ["derive"] }
serde_json   = { version = "1.0.140" }
rmp-serde    = { version = "1.3.0" }

# Crypto
argon2       = { version = "0.5.3", features = ["zeroize"] }
aes-gcm      = { version = "0.10.3" }
rand         = { version = "0.9.1", features = ["std"] }
rand_core    = { version = "0.9.3", features = ["std"] }
zeroize      = { version = "1.8.1", features = ["derive"] }
k256         = { version = "0.13.4", features = ["ecdh", "schnorr"] }
sha2         = { version = "0.10.9" }
hmac         = { version = "0.12.1" }
hkdf         = { version = "0.12.4" }
hex          = { version = "0.4.3" }

# TOTP
totp-rs      = { version = "5.6.0" }

# Async / networking (sync engine)
tokio        = { version = "1.45.1", features = ["full"] }
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3.31" }

# Utilities
uuid         = { version = "1.16.0", features = ["v4", "serde"] }
chrono       = { version = "0.4.41", features = ["serde"] }
thiserror    = { version = "2.0.12" }
anyhow       = { version = "1.0.98" }
base64       = { version = "0.22.1" }
tracing      = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# Testing
proptest     = { version = "1.6.0" }

[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1
strip       = true

[profile.dev]
opt-level   = 0
debug       = true
