[package]
name        = "zvault-core"
description = "Core library for ZVault — cryptography, data model, sync engine"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["biometric", "native"]
# Compile out biometric unlock on platforms that don't support it
biometric = []
# Native platform features (filesystem I/O, async networking).
# Disable for WASM builds.
native = ["tokio", "tokio-tungstenite", "futures-util"]
# Expose InMemoryStorage and other test helpers to dependent crates (e.g. integration tests)
test-helpers = []
# Keyring-based SecureStorage (desktop platforms only; not available in WASM)
keyring-storage = ["dep:keyring"]

[dependencies]
serde        = { workspace = true }
serde_json   = { workspace = true }
rmp-serde    = { workspace = true }
argon2       = { workspace = true }
aes-gcm      = { workspace = true }
chacha20     = { workspace = true }
rand         = { workspace = true }
rand_core    = { workspace = true }
zeroize      = { workspace = true }
k256         = { workspace = true }
sha2         = { workspace = true }
hmac         = { workspace = true }
hkdf         = { workspace = true }
hex          = { workspace = true }
totp-rs      = { workspace = true }
tokio        = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
uuid         = { workspace = true }
chrono       = { workspace = true }
thiserror    = { workspace = true }
anyhow       = { workspace = true }
base64       = { workspace = true }
csv          = { workspace = true }
tracing      = { workspace = true }
keyring      = { workspace = true, optional = true }

[dev-dependencies]
proptest     = { workspace = true }
tokio        = { workspace = true }
tempfile     = "3"
